name: Deploy naar mijn.host

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Code ophalen uit GitHub
      uses: actions/checkout@v4

    - name: PHP instellen
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, mysql

    - name: Composer Packages installeren
      run: |
        composer install --no-ansi --no-dev --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader

    - name: Node.js instellen
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: NPM installeren en Vue PWA bouwen
      run: |
        npm ci
        npm run build

    - name: SSH-key laden
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Host sleutel toevoegen
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        ssh-keyscan -H "${{ secrets.FTP_SERVER }}" >> ~/.ssh/known_hosts

    - name: Bestanden naar de server
      env:
        SSH_USER: ${{ secrets.FTP_USERNAME }}
        SSH_HOST: ${{ secrets.FTP_SERVER }}
        DEPLOY_PATH: ${{ secrets.SSH_PATH }}
      run: |
        TARGET="${DEPLOY_PATH:-public_html}"
        rsync -az --delete \
          --exclude='.git/' \
          --exclude='.github/' \
          --exclude='.env' \
          --exclude='.env.*' \
          --exclude='node_modules/' \
          --exclude='tests/' \
          --exclude='storage/logs/' \
          --exclude='storage/framework/cache/' \
          --exclude='storage/framework/sessions/' \
          --exclude='storage/framework/views/' \
          --exclude='.phpunit.cache/' \
          ./ "${SSH_USER}@${SSH_HOST}:${TARGET}/"

    - name: Migraties en cache
      env:
        SSH_USER: ${{ secrets.FTP_USERNAME }}
        SSH_HOST: ${{ secrets.FTP_SERVER }}
        DEPLOY_PATH: ${{ secrets.SSH_PATH }}
      run: |
        TARGET="${DEPLOY_PATH:-public_html}"
        ssh "${SSH_USER}@${SSH_HOST}" "cd ${TARGET} && php artisan migrate --force && php artisan optimize"
