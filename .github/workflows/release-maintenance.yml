name: Release-opslag beheren
on:
  push:
    branches: ['release-deploy/**', 'repair/**']
    paths: ['.github/workflows/release-maintenance.yml', 'scripts/release-maintenance.sh']
  workflow_dispatch:
    inputs:
      operation:
        description: 'Serverindeling controleren of oude installatie archiveren'
        type: choice
        options: [inspect, cleanup]
        default: inspect
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: SSH-doel controleren
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
          FOODTRACKER_SSH_PATH: ${{ secrets.FOODTRACKER_SSH_PATH }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: bash scripts/release-target.sh
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Vertrouwde hostsleutel instellen
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST_FINGERPRINT: ${{ vars.SSH_HOST_FINGERPRINT }}
        run: bash scripts/release-ssh.sh
      - name: Serverindeling beheren
        env:
          OPERATION: ${{ inputs.operation || 'inspect' }}
        run: |
          source scripts/deploy-config.sh
          PUBLIC=$(ssh -p "$SSH_TARGET_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "${SSH_TARGET_USER}@${SSH_TARGET_HOST}" "bash -s -- '$DEPLOY_TARGET' '$DEPLOY_URL' '$DEPLOY_APP'" < scripts/release-resolve.sh)
          ssh -p "$SSH_TARGET_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "${SSH_TARGET_USER}@${SSH_TARGET_HOST}" "bash -s -- '$PUBLIC' '$DEPLOY_APP' '$DEPLOY_URL' '$OPERATION'" < scripts/release-maintenance.sh
