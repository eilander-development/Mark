name: Nieuwe release-deploy controleren
on:
  push:
    branches: ['release-deploy/**']
  pull_request:
    branches: [main]
    paths: ['scripts/release-*', 'scripts/deploy-config.sh', 'tests/release_deploy_test.py', '.github/workflows/deploy-releases.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Nieuwe release activeren op de hostingserver (bestaande deploy blijft apart)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, mbstring, dom, xml, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Afhankelijkheden en frontend bouwen
        run: |
          APP=.
          if [ -f backend/artisan ]; then APP=backend; fi
          echo "APP_DIR=$APP" >> "$GITHUB_ENV"
          composer install --working-dir="$APP" --no-interaction --no-plugins --no-scripts --prefer-dist
          cp "$APP/.env.example" "$APP/.env"
          (cd "$APP" && php artisan package:discover --no-interaction)
          npm ci
          npm run build
      - name: App en releasescripts testen
        env:
          APP_ENV: testing
          APP_URL: http://localhost
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          DB_LEDGER_DRIVER: sqlite
          DB_CATALOG_DRIVER: sqlite
          DB_CATALOG_DATABASE: ':memory:'
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: |
          source scripts/deploy-config.sh
          export DB_CONNECTION="$DEPLOY_TEST_CONNECTION"
          if node -e 'process.exit(require("./package.json").scripts.test ? 0 : 1)'; then npm test; fi
          mkdir -p "$APP_DIR/storage/framework/testing/views"
          (cd "$APP_DIR" && php artisan test && php artisan optimize)
          bash -n scripts/release-{package,target,resolve,activate,ssh}.sh scripts/deploy-config.sh
          python3 -m unittest discover -s tests -p release_deploy_test.py -v
          bash scripts/release-package.sh /tmp/release.tgz
          tar -tzf /tmp/release.tgz > /tmp/release-files.txt
          grep -q '^public/release.json$' /tmp/release-files.txt
          if grep -Eq '(^|/)([.]env[^/]*|node_modules|[.]git|qa)(/|$)' /tmp/release-files.txt; then exit 1; fi
      - name: Productieafhankelijkheden en bundel controleren
        run: |
          composer install --working-dir="$APP_DIR" --no-dev --no-interaction --no-plugins --no-scripts --prefer-dist --optimize-autoloader
          bash scripts/release-package.sh /tmp/production-release.tgz
  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: SSH-doel controleren
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
          FOODTRACKER_SSH_PATH: ${{ secrets.FOODTRACKER_SSH_PATH }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: bash scripts/release-target.sh
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Vertrouwde hostsleutel instellen
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST_FINGERPRINT: ${{ vars.SSH_HOST_FINGERPRINT }}
        run: bash scripts/release-ssh.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, dom, xml, curl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Productierelease bouwen
        run: |
          APP=.
          if [ -f backend/artisan ]; then APP=backend; fi
          composer install --working-dir="$APP" --no-dev --no-interaction --no-plugins --no-scripts --prefer-dist --optimize-autoloader
          npm ci
          npm run build
          bash scripts/release-package.sh /tmp/release.tgz
      - name: Webroot controleren en release uploaden
        run: |
          source scripts/deploy-config.sh
          PUBLIC=$(ssh -p "$SSH_TARGET_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "${SSH_TARGET_USER}@${SSH_TARGET_HOST}" "bash -s -- '$DEPLOY_TARGET' '$DEPLOY_URL' '$DEPLOY_APP'" < scripts/release-resolve.sh)
          RELEASE="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          STAGE="$(dirname "$PUBLIC")/$DEPLOY_APP-releases/$RELEASE"
          ssh -p "$SSH_TARGET_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "${SSH_TARGET_USER}@${SSH_TARGET_HOST}" "umask 077; mkdir -p '$STAGE'"
          scp -P "$SSH_TARGET_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes /tmp/release.tgz "${SSH_TARGET_USER}@${SSH_TARGET_HOST}:$STAGE/payload.tgz"
          echo "DEPLOY_PUBLIC=$PUBLIC" >> "$GITHUB_ENV"
          echo "DEPLOY_RELEASE=$RELEASE" >> "$GITHUB_ENV"
      - name: Back-up, migraties, activering en livecontrole
        run: |
          source scripts/deploy-config.sh
          ssh -p "$SSH_TARGET_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "${SSH_TARGET_USER}@${SSH_TARGET_HOST}" "bash -s -- '$DEPLOY_PUBLIC' '$DEPLOY_RELEASE' '$DEPLOY_APP' '$DEPLOY_URL'" < scripts/release-activate.sh
      - name: Publicatie samenvatten
        run: echo "Release $DEPLOY_RELEASE gepubliceerd op $DEPLOY_URL en live gecontroleerd." >> "$GITHUB_STEP_SUMMARY"
